name: Release Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Synthetic browser-auth configuration. Tests intercept all provider requests.
      NEXT_PUBLIC_SUPABASE_URL: https://auth-fixture.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-public-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Disposable Database Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          pg_config --bindir >> "$GITHUB_PATH"
      - run: npm run test:database
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 7
